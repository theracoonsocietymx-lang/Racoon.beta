# Compila Racoon y los 16 plugins para Windows en los servidores de GitHub (gratis en repositorios públicos).
# En GitHub: pestaña Actions > "Racoon para Windows" > Run workflow. Los plugins y el estudio se compilan al mismo
# tiempo en dos máquinas; al terminar quedan abajo, en Artifacts, "Plugins-Windows" y "Estudio-Windows".
# El repositorio necesita las tres carpetas del paquete en su raíz: estudio, plugins y muestras.
name: Racoon para Windows

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  plugins:
    name: Los 16 plugins
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: JUCE de los plugins
        shell: bash
        run: |
          if [ ! -f plugins/JUCE/CMakeLists.txt ]; then
            git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git plugins/JUCE
          fi

      - name: Configurar
        run: cmake -S plugins -B plugins/build-win -G "Visual Studio 17 2022" -A x64 -DRF_TESTS=ON

      - name: Compilar los VST3 y las pruebas
        shell: bash
        run: |
          T=""
          for p in Badger Hamster Dormouse Squirrel Chipmunk Mole Skunk Ferret Porcupine Hedgehog Chinchilla Marmot Jerboa Opossum Otter Beaver; do
            T="$T Racoon${p}_VST3"
          done
          cmake --build plugins/build-win --config Release --parallel --target $T FamilyTest

      - name: Juntar
        shell: pwsh
        run: |
          $out = "dist/Plugins-Windows"
          New-Item -ItemType Directory -Force -Path "$out/VST3" | Out-Null
          Get-ChildItem -Path plugins/build-win -Recurse -Directory -Filter *.vst3 |
            Where-Object { $_.FullName -match "Release" -and $_.Parent.Name -eq "VST3" } |
            ForEach-Object { Copy-Item $_.FullName -Destination "$out/VST3" -Recurse -Force }
          Get-ChildItem -Path plugins/build-win -Recurse -Filter FamilyTest.exe | Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName -Destination $out }
          Get-ChildItem "$out/VST3" | Format-Table Name

      - uses: actions/upload-artifact@v4
        with:
          name: Plugins-Windows
          path: dist/Plugins-Windows

  estudio:
    name: Racoon, el estudio
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Motor de audio (Tracktion Engine y su JUCE)
        shell: bash
        run: bash estudio/scripts/fetch_deps.sh

      - name: Configurar
        run: cmake -S estudio -B estudio/build-win -G "Visual Studio 17 2022" -A x64 -DRACOON_TESTS=ON

      - name: Compilar Racoon y sus pruebas
        run: cmake --build estudio/build-win --config Release --parallel --target Racoon RacoonTest FxTest

      - name: Juntar
        shell: pwsh
        run: |
          $out = "dist/Estudio-Windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($n in "Racoon.exe", "RacoonTest.exe", "FxTest.exe") {
            Get-ChildItem -Path estudio/build-win -Recurse -Filter $n | Select-Object -First 1 |
              ForEach-Object { Copy-Item $_.FullName -Destination $out }
          }
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio-Windows
          path: dist/Estudio-Windows
